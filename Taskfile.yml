version: "3"

includes:
  be:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend/pkg
  fe:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend

vars:
  # The CI job e2e (.gitlab-ci.yml) runs the same
  E2E_COMPOSE: docker compose -p timetrack-e2e -f compose.yaml -f compose.e2e.yaml

tasks:
  check:
    desc: Lint, build and test backend and frontend (what CI runs on merge requests)
    cmds:
      - task: be:check
      - task: fe:check

  up:
    desc: Run the dev stack (backend, frontend, Postgres, Dex)
    cmds:
      - docker compose up --build

  test:e2e:
    desc: End-to-end tests (Playwright) against the whole stack, needs docker; not part of check
    cmds:
      - defer: "{{.E2E_COMPOSE}} down -v --remove-orphans"
      - defer:
          task: test:e2e:report
      - "{{.E2E_COMPOSE}} run -T --build --name timetrack-e2e-run e2e"

  test:e2e:report:
    desc: Copy the report of the last e2e run to e2e/
    internal: true
    cmds:
      - rm -rf e2e/playwright-report e2e/test-results e2e/junit
      - cmd: docker cp timetrack-e2e-run:/e2e/playwright-report e2e/playwright-report
        ignore_error: true
      - cmd: docker cp timetrack-e2e-run:/e2e/test-results e2e/test-results
        ignore_error: true
      - cmd: docker cp timetrack-e2e-run:/e2e/junit e2e/junit
        ignore_error: true
