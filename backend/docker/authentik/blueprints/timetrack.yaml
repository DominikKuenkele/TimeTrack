version: 1
metadata:
  name: TimeTrack Local Dev
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: |
      Pre-configures the TimeTrack OAuth2/OIDC provider and application for local development.
      Client ID: timetrack-local-dev
      Redirect URIs: http://localhost:3000/auth/callback (dev), http://frontend:3000/auth/callback (e2e stack)

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: timetrack-provider
    state: present
    identifiers:
      name: TimeTrack Local Dev
    attrs:
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Fixed client ID so the env file works without any manual copying
      client_id: timetrack-local-dev
      client_type: public
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/auth/callback
        # The e2e stack (compose.e2e.yaml) serves the frontend under its service name
        - matching_mode: strict
          url: http://frontend:3000/auth/callback
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    state: present
    identifiers:
      slug: timetrack
    attrs:
      name: TimeTrack
      slug: timetrack
      provider: !KeyOf timetrack-provider
