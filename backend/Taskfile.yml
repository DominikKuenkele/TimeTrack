version: "3"

tasks:
  lint:
    desc: go vet
    cmds:
      - go vet ./...

  build:
    desc: Build the backend
    cmds:
      - go build ./...

  test:
    desc: Run the backend tests
    cmds:
      - go test ./...

  security:
    desc: Known vulnerabilities in dependencies and the standard library (govulncheck)
    cmds:
      - govulncheck ./...

  check:
    desc: Lint, build, test and security-check the backend
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: security
