stages: [prepare, check, build, deliver]

variables:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  CHECK_IMAGE: $CI_REGISTRY_IMAGE/ci/check:go-$GO_VERSION-node-$NODE_VERSION

.on_mr_or_main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.on_main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.version: &version
  - export VERSION="$(echo "${CI_PIPELINE_CREATED_AT%%T*}" | tr - .)-$CI_PIPELINE_IID"

# The runner mounts the socket of its own rootless daemon, which only runs CI.
.docker:
  image: docker:29.8.1-cli
  before_script:
    - *version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build_check_image:
  extends: [.on_mr_or_main, .docker]
  stage: prepare
  script:
    - docker build -t "$CHECK_IMAGE" --build-arg GO_VERSION="$GO_VERSION" --build-arg NODE_VERSION="$NODE_VERSION" ci/check
    - docker push "$CHECK_IMAGE"

check:
  extends: .on_mr_or_main
  stage: check
  image: $CHECK_IMAGE
  script:
    - task check

build_backend:
  extends: [.on_main, .docker]
  stage: build
  script:
    - docker build --target prod -t "$CI_REGISTRY_IMAGE/backend:$VERSION" -t "$CI_REGISTRY_IMAGE/backend:latest" backend
    - docker push --all-tags "$CI_REGISTRY_IMAGE/backend"

build_frontend:
  extends: [.on_main, .docker]
  stage: build
  script:
    - |
      cat > frontend/.env <<EOF
      VITE_API_URL=${VITE_API_URL}
      VITE_NODE_ENV=${VITE_NODE_ENV}
      VITE_OIDC_AUTHORITY=${VITE_OIDC_AUTHORITY}
      VITE_OIDC_CLIENT_ID=${VITE_OIDC_CLIENT_ID}
      EOF
    - docker build --target prod -t "$CI_REGISTRY_IMAGE/frontend:$VERSION" -t "$CI_REGISTRY_IMAGE/frontend:latest" frontend
    - docker push --all-tags "$CI_REGISTRY_IMAGE/frontend"

deliver:
  extends: .on_main
  stage: deliver
  image: alpine:3.24
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git curl jq
    - *version
    - notes=$(sh ci/release-notes.sh 'deploy-*')
    - |
      jq -n --arg tag "deploy-$VERSION" --arg ref "$CI_COMMIT_SHA" --arg notes "$notes" \
        '{tag_name: $tag, ref: $ref, name: $tag, description: $notes}' \
        | curl -sf -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" -H 'Content-Type: application/json' \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" -d @-
