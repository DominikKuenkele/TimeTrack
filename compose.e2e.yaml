# End-to-end test stack: `docker compose -f compose.yaml -f compose.e2e.yaml` (`task test:e2e`)
#
# Builds on the dev stack (same services, same database schema, same Dex client), with these changes:
# - No bind mounts, no published ports and no debugger: the CI runner talks to a remote rootless docker
#   daemon, on which paths of the checkout don't exist. What the dev setup mounts is built into images instead.
# - The browser (the `e2e` service, inside the network) and the backend reach Dex, the frontend and the backend by
#   their service names, so the backend needs no separate discovery URL.
# - Backend and browser run in UTC like the database.
# - Dex runs with config.e2e.yaml: the issuer under its service name and the test users.
services:
  db:
    build:
      context: ./backend/database
      dockerfile: Dockerfile.e2e
    image: timetrack-e2e-db
    ports: !reset []
    volumes: !reset []

  backend:
    build:
      context: ./backend
      target: prod
    ports: !reset []
    volumes: !reset []
    environment:
      TZ: UTC
      FRONTEND_ADDRESS: http://frontend:3000
      OAUTH_SERVER_URL: http://dex:5556/dex
      OAUTH_DISCOVERY_URL: http://dex:5556/dex
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 80" ]
      interval: 2s
      retries: 30

  frontend:
    ports: !reset []
    volumes: !reset []
    environment:
      VITE_API_URL: http://backend
      VITE_NODE_ENV: development
      VITE_OIDC_AUTHORITY: http://dex:5556/dex
      VITE_OIDC_CLIENT_ID: timetrack-local-dev
    healthcheck:
      # Also compiles the app once, so that Vite doesn't reload the page while the first test runs
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ && wget -qO /dev/null http://127.0.0.1:3000/src/index.tsx" ]
      interval: 2s
      retries: 60

  dex:
    command: [ "dex", "serve", "/etc/dex/config.e2e.yaml" ]
    ports: !reset []

  e2e:
    build:
      context: ./e2e
    environment:
      CI: ${CI:-}
      BASE_URL: http://frontend:3000
      API_URL: http://backend
      DEX_URL: http://dex:5556
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
