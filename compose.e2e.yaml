# End-to-end test stack: `docker compose -f compose.yaml -f compose.e2e.yaml` (`task test:e2e`)
#
# Builds on the dev stack (same services, same database schema), with these changes:
# - No bind mounts, no published ports and no debugger: the CI runner talks to a remote rootless docker
#   daemon, on which paths of the checkout don't exist. What the dev setup mounts is built into images instead.
# - The browser (the `e2e` service, inside the network) reaches the frontend by its service name, and the API
#   through the frontend's proxy, as on the same host in production.
# - No DEV_USER: each test user sends the headers Authentik's forward auth would set, and a request without
#   them is rejected as in production.
# - Backend and browser run in UTC like the database.
services:
  db:
    build:
      context: ./backend/database
      dockerfile: Dockerfile.e2e
    image: timetrack-e2e-db
    ports: !reset []
    volumes: !reset []

  backend:
    build:
      context: ./backend
      target: prod
    ports: !reset []
    volumes: !reset []
    environment:
      TZ: UTC
      DEV_USER: ""
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 80" ]
      interval: 2s
      retries: 30

  frontend:
    ports: !reset []
    volumes: !reset []
    healthcheck:
      # Also compiles the app once, so that Vite doesn't reload the page while the first test runs
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ && wget -qO /dev/null http://127.0.0.1:3000/src/index.tsx" ]
      interval: 2s
      retries: 60

  e2e:
    build:
      context: ./e2e
    environment:
      CI: ${CI:-}
      BASE_URL: http://frontend:3000
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
