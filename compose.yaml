# Dev environment — prerequisites: docker
# The app (http://localhost:3000) has no login here: the backend signs every request in as DEV_USER, which
# stands in for the user Authentik's forward auth passes in production.
services:
  backend:
    build:
      context: ./backend
      target: debug
    ports:
      - "8080:80"
      - "2345:2345"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: timetrack
      POSTGRES_PASSWORD: timetrack
      POSTGRES_DB: timetrack
      LOG_LEVEL: debug
      LOG_FILE: timetrack.log
      DEV_USER: dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://backend
    volumes:
      - ./frontend:/app
      # Isolate container node_modules from the host to avoid arch conflicts
      - frontend_node_modules:/app/node_modules

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: timetrack
      POSTGRES_PASSWORD: timetrack
      POSTGRES_DB: timetrack
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U timetrack -d timetrack" ]
      interval: 2s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
    driver: local
