# Dev environment — prerequisites: docker
# Log in to the app (http://localhost:3000) as dev@timetrack.local / dev (or dev2@timetrack.local / dev), see
# backend/docker/dex/config.yaml
services:
  backend:
    build:
      context: ./backend
      target: debug
    ports:
      - "8080:80"
      - "2345:2345"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: timetrack
      POSTGRES_PASSWORD: timetrack
      POSTGRES_DB: timetrack
      LOG_LEVEL: debug
      LOG_FILE: timetrack.log
      FRONTEND_ADDRESS: http://localhost:3000
      # The browser reaches Dex on localhost, the backend by its service name
      OAUTH_SERVER_URL: http://localhost:5556/dex
      OAUTH_DISCOVERY_URL: http://dex:5556/dex
      OAUTH_CLIENT_ID: timetrack-local-dev
    depends_on:
      db:
        condition: service_healthy
      dex:
        condition: service_healthy
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Isolate container node_modules from the host to avoid arch conflicts
      - frontend_node_modules:/app/node_modules

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: timetrack
      POSTGRES_PASSWORD: timetrack
      POSTGRES_DB: timetrack
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U timetrack -d timetrack" ]
      interval: 2s
      retries: 5

  dex:
    build:
      context: ./backend/docker/dex
    command: [ "dex", "serve", "/etc/dex/config.yaml" ]
    ports:
      - "5556:5556"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5558/healthz" ]
      interval: 1s
      retries: 30

volumes:
  postgres_data:
  frontend_node_modules:
    driver: local
