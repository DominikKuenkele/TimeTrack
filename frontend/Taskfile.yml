version: "3"

tasks:
  deps:
    desc: Install dependencies from the lockfile
    sources: [package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  lint:
    desc: ESLint
    deps: [deps]
    cmds:
      - npm run lint

  build:
    desc: Type-check and build the frontend
    deps: [deps]
    cmds:
      - npm run build

  test:
    desc: Unit and component tests (Vitest)
    deps: [deps]
    cmds:
      - npm run test

  security:
    desc: Known vulnerabilities in production dependencies (npm audit)
    deps: [deps]
    cmds:
      - npm audit --omit=dev

  check:
    desc: Lint, build, test and security-check the frontend
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: security
