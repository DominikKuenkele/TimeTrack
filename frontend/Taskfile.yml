version: "3"

tasks:
  deps:
    desc: Install dependencies from the lockfile
    sources: [package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  lint:
    desc: ESLint
    deps: [deps]
    cmds:
      - npm run lint

  build:
    desc: Type-check and build the frontend
    deps: [deps]
    cmds:
      - npm run build

  test:
    desc: Unit and component tests (Vitest)
    deps: [deps]
    cmds:
      - npm run test

  check:
    desc: Lint, build and test the frontend
    cmds:
      - task: lint
      - task: build
      - task: test
